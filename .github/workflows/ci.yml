name: CI

on:
  push:
    branches: [main]
  pull_request:
  # GitHub's merge queue runs the required checks on each merge group.
  merge_group:

jobs:
  # The API tests, split by file across runners so they run side by side. Each shard starts its own Postgres.
  test:
    name: test (${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx vitest run --shard=${{ matrix.shard }}/3

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Start the Compose stack
        run: docker compose up --build --wait --wait-timeout 120
      - name: Check the app answers
        run: |
          curl --fail --silent http://localhost:3000/api/health
          curl --fail --silent http://localhost:3000/api/setup
          curl --fail --silent http://localhost:3000/ | grep -q '<div id="root">'
      - name: Show logs
        if: failure()
        run: docker compose logs
      - run: docker compose down -v
        if: always()
