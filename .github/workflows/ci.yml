name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Start the Compose stack
        run: docker compose up --build --wait --wait-timeout 120
      - name: Check the app answers
        run: |
          curl --fail --silent http://localhost:3000/api/health
          curl --fail --silent http://localhost:3000/api/setup
          curl --fail --silent http://localhost:3000/ | grep -q '<div id="root">'
      - name: Show logs
        if: failure()
        run: docker compose logs
      - run: docker compose down -v
        if: always()
